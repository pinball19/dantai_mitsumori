<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="団体旅行の幹事さん必見！AIチャットで簡単見積り。学校・企業・町内会の旅行を一括対応。貸切バス手配も簡単プランニング。">
    <title>団体旅行.com | 団体旅行の幹事さん必見！AIチャットで簡単見積り</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <div class="wrapper">
        <!-- ヘッダーを読み込み -->
        <div id="header-container"></div>
        
        <!-- トップバナー -->
        <div class="top-banner">
            <div class="top-banner-content">
                <h2>団体旅行の幹事さん必見！<br>AIチャットで簡単見積り</h2>
                <p>学校・企業・町内会…一括対応！<br>プロがあなたの旅行計画をサポートします</p>
                <a href="#ai-chat" class="cta-button">AIチャットで無料見積もり</a>
            </div>
        </div>
        
        <!-- ターゲット別セクション -->
        <div id="target-section-container"></div>
        
        <!-- AIチャット見積もりセクション -->
        <div id="chat-container"></div>
        
        <!-- 特徴セクション -->
        <div id="features-container"></div>
        
        <!-- 信頼性セクション -->
        <div id="trust-container"></div>
        
        <!-- FAQセクション -->
        <div id="faq-container"></div>
        
        <!-- CTAセクション -->
        <div id="cta-container"></div>
        
        <!-- フッター -->
        <div id="footer-container"></div>
    </div>

    <script src="assets/js/main.js"></script>
    <script>
        // コンポーネントの読み込み
        document.addEventListener('DOMContentLoaded', function() {
            // 各コンポーネントをロード
            fetch('assets/components/header.html')
                .then(response => response.text())
                .then(data => {
                    document.getElementById('header-container').innerHTML = data;
                });
                
            fetch('assets/components/target-section.html')
                .then(response => response.text())
                .then(data => {
                    document.getElementById('target-section-container').innerHTML = data;
                });
                
            fetch('assets/components/chat.html')
                .then(response => response.text())
                .then(data => {
                    document.getElementById('chat-container').innerHTML = data;
                });
                
            fetch('assets/components/features.html')
                .then(response => response.text())
                .then(data => {
                    document.getElementById('features-container').innerHTML = data;
                });
                
            fetch('assets/components/trust.html')
                .then(response => response.text())
                .then(data => {
                    document.getElementById('trust-container').innerHTML = data;
                });
                
            fetch('assets/components/faq.html')
                .then(response => response.text())
                .then(data => {
                    document.getElementById('faq-container').innerHTML = data;
                });
                
            fetch('assets/components/cta.html')
                .then(response => response.text())
                .then(data => {
                    document.getElementById('cta-container').innerHTML = data;
                });
                
            fetch('assets/components/footer.html')
                .then(response => response.text())
                .then(data => {
                    document.getElementById('footer-container').innerHTML = data;
                });
        });
    </script>
</body>
</html>
